<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600"><defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pkt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .body  { fill: #DCE7F0; }
      .small { fill: #7E96AA; }
      .k     { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; fill: #4F6B82; }
      .v     { fill: #C7D6E3; }
      .h1    { font-weight: 700; fill: #F1F7FB; }
      .tag   { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #7DD3FC; }
    </style>
  </defs><rect x="0.5" y="0.5" width="679" height="599" rx="16" fill="url(#panel)" stroke="#14304A"/><text x="36" y="76" class="label">01 — 关于 / ABOUT</text><rect x="36" y="96" width="36" height="2" fill="url(#accent)"/><text x="36" y="150" class="body" font-size="31">2026 级智能科学与技术本科生。现阶段把</text><text x="36" y="200" class="body" font-size="31">C 和 Python 练到能独立写出东西，同时</text><text x="36" y="250" class="body" font-size="31">用大模型做一些真的能跑起来的小工具。</text><text x="36" y="316" class="body" font-size="31">比起堆功能，我更在意「这个东西为什么这</text><text x="36" y="366" class="body" font-size="31">样设计」。</text><line x1="36" y1="414" x2="644" y2="414" stroke="#14304A"/><text x="36" y="448" class="small" font-size="20">First-year student in Intelligent Science &amp; Technology.</text><text x="36" y="480" class="small" font-size="20">Getting fluent in C and Python, and building small tools</text><text x="36" y="512" class="small" font-size="20">on top of large language models.</text>
  <circle cx="608" cy="70" r="3" fill="#5EEAD4">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="608" cy="70" r="7" fill="#5EEAD4" opacity="0.18">
    <animate attributeName="r" values="7;12;7" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <line x1="0" y1="599" x2="680" y2="599" stroke="#12283C" stroke-width="1"/>
  <rect x="0" y="598" width="110" height="2" fill="url(#pkt)" opacity="0.55">
    <animate attributeName="x" values="-120;680" dur="9s" repeatCount="indefinite"/>
  </rect></svg>