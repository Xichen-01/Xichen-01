<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 464" width="1200" height="464"><defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pkt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .body  { fill: #DCE7F0; }
      .small { fill: #7E96AA; }
      .k     { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; fill: #4F6B82; }
      .v     { fill: #C7D6E3; }
      .h1    { font-weight: 700; fill: #F1F7FB; }
      .tag   { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #7DD3FC; }
    </style>
  </defs><rect x="0.5" y="0.5" width="1199" height="463" rx="16" fill="url(#panel)" stroke="#14304A"/><text x="72" y="76" class="label">01 — 关于 / ABOUT</text><rect x="72" y="96" width="36" height="2" fill="url(#accent)"/><text x="72" y="150" class="body" font-size="29">2026 级智能科学与技术本科生。现阶段把 C 和 Python 练到能独立写出东西，</text><text x="72" y="198" class="body" font-size="29">同时用大模型做一些真的能跑起来的小工具。</text><text x="72" y="264" class="body" font-size="29">比起堆功能，我更在意「这个东西为什么这样设计」。</text><line x1="72" y1="312" x2="1128" y2="312" stroke="#14304A"/><text x="72" y="346" class="small" font-size="19">First-year student in Intelligent Science &amp; Technology. Getting fluent in C and Python, and building small</text><text x="72" y="377" class="small" font-size="19">tools on top of large language models.</text>
  <circle cx="1128" cy="70" r="3" fill="#5EEAD4">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1128" cy="70" r="7" fill="#5EEAD4" opacity="0.18">
    <animate attributeName="r" values="7;12;7" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <line x1="0" y1="463" x2="1200" y2="463" stroke="#12283C" stroke-width="1"/>
  <rect x="0" y="462" width="110" height="2" fill="url(#pkt)" opacity="0.55">
    <animate attributeName="x" values="-120;1200" dur="9s" repeatCount="indefinite"/>
  </rect></svg>