</style><rect width="1200" height="518" fill="#04090F"/><rect width="1200" height="518" fill="url(#g1)" opacity="0.5"/><rect width="1200" height="518" fill="url(#g2)" opacity="0.45"/><rect width="1200" height="518" fill="url(#lg)"/><rect x="24" y="24" width="1152" height="470" fill="none" stroke="#254A62"/><path d="M24 36 V24 H36" fill="none" stroke="#2E5A78" stroke-width="1.5"/><path d="M1176 36 V24 H1164" fill="none" stroke="#2E5A78" stroke-width="1.5"/><path d="M24 482 V494 H36" fill="none" stroke="#2E5A78" stroke-width="1.5"/><path d="M1176 482 V494 H1164" fill="none" stroke="#2E5A78" stroke-width="1.5"/><rect x="72" y="38" width="32" height="32" fill="none" stroke="#254A62"/><text x="88" y="60" text-anchor="middle" font-size="14" fill="#5EEAD4" font-family="Consolas,monospace">01</text><text x="120" y="66" font-size="27" font-weight="700" fill="#DCE7F0">关于我</text><text x="217.0" y="64" class="mono">ABOUT ME</text><line x1="72" y1="96" x2="1128" y2="96" stroke="#254A62"/><line x1="72" y1="92" x2="72" y2="100" stroke="#254A62"/><line x1="1128" y1="92" x2="1128" y2="100" stroke="#254A62"/><rect x="72" y="95.5" width="118" height="2" fill="url(#accent)"/><text x="72" y="132" class="mono">个人简介 / PROFILE</text><line x1="72" y1="142" x2="580" y2="142" stroke="#254A62" opacity="0.6"/><text x="660" y="132" class="mono">EN</text><line x1="660" y1="142" x2="1128" y2="142" stroke="#254A62" opacity="0.6"/><text x="72" y="176" font-size="29" fill="#DCE7F0">2026 级智能科学与技术本科生。现阶段</text><text x="72" y="222" font-size="29" fill="#DCE7F0">把 C 和 Python 练到能独立写出东西，</text><text x="72" y="268" font-size="29" fill="#DCE7F0">同时用大模型做一些真的能跑起来的小</text><text x="72" y="314" font-size="29" fill="#DCE7F0">工具。</text><text x="72" y="378" font-size="29" fill="#DCE7F0">比起堆功能，我更在意「这个东西为什</text><text x="72" y="424" font-size="29" fill="#DCE7F0">么这样设计」。</text><text x="660" y="176" font-size="21" fill="#93A9BB">First-year student in Intelligent Science</text><text x="660" y="208" font-size="21" fill="#93A9BB">&amp; Technology. Getting fluent in C and</text><text x="660" y="240" font-size="21" fill="#93A9BB">Python, and building small tools on top of</text><text x="660" y="272" font-size="21" fill="#93A9BB">large language models. More than piling up</text><text x="660" y="304" font-size="21" fill="#93A9BB">features, I care about why a thing is</text><text x="660" y="336" font-size="21" fill="#93A9BB">designed the way it is.</text><line x1="626" y1="124" x2="626" y2="474" stroke="#254A62"/><line x1="621" y1="124" x2="631" y2="124" stroke="#254A62"/><line x1="621" y1="474" x2="631" y2="474" stroke="#254A62"/></svg>