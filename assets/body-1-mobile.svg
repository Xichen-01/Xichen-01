<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 556" width="680" height="556"><defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.75" stop-color="#38BDF8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B9CF6" stop-opacity="0.30"/><stop offset="1" stop-color="#8B9CF6" stop-opacity="0"/>
  </radialGradient>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Inter", "Noto Sans SC", sans-serif; }
    .mono { font-family: Consolas, "JetBrains Mono", monospace; }
  </style>
</defs><rect x="0" y="0" width="680" height="556" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="679" height="555" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><rect x="32" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="47" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">01</text><text x="76" y="52" font-size="22" font-weight="700" letter-spacing="2.5" fill="#F4F8FF">ABOUT</text><text x="175.4" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">关于</text><line x1="32" y1="76" x2="648" y2="76" stroke="#1E4159"/><rect x="32" y="75" width="72" height="2" fill="url(#bar)"/><text x="32" y="118" class="mono" font-size="10" letter-spacing="3.2" fill="#6B7F9E">PROFILE</text><text x="32" y="148" font-size="19" fill="#CBD8EA">First-year student in Intelligent Science &amp; Technology. I</text><text x="32" y="179" font-size="19" fill="#CBD8EA">keep wondering whether a machine can remember a person —</text><text x="32" y="210" font-size="19" fill="#CBD8EA">and still recognise that light years later.</text><text x="32" y="253" font-size="19" fill="#CBD8EA">So I'm building Shuguang: an AI that remembers, refuses,</text><text x="32" y="284" font-size="19" fill="#CBD8EA">and slowly grows a self. Along the way I write small tools</text><text x="32" y="315" font-size="19" fill="#CBD8EA">that actually run.</text><line x1="32" y1="356" x2="648" y2="356" stroke="#17324A"/><text x="32" y="396" font-size="13" letter-spacing="2.4" fill="#6B7F9E">个人简介</text><text x="32" y="424" font-size="14" fill="#8FA3BC">2026 级智能科学与技术本科生。想一些更远的事：机器能不能记住一个人，能不能在很久以后还认</text><text x="32" y="449" font-size="14" fill="#8FA3BC">得那束光。</text><text x="32" y="482" font-size="14" fill="#8FA3BC">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样子的 AI。也写一些真的能跑起来的小</text><text x="32" y="507" font-size="14" fill="#8FA3BC">工具。</text></svg>