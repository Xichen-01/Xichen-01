<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500"><defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.75" stop-color="#38BDF8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B9CF6" stop-opacity="0.30"/><stop offset="1" stop-color="#8B9CF6" stop-opacity="0"/>
  </radialGradient>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Inter", "Noto Sans SC", sans-serif; }
    .mono { font-family: Consolas, "JetBrains Mono", monospace; }
  </style>
</defs><rect x="0" y="0" width="680" height="500" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="679" height="499" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><path d="M1 486 V499 H14" fill="none" stroke="#5EEAD4" stroke-opacity="0.5"/><rect x="32" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="47" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">01</text><text x="76" y="52" font-size="22" font-weight="700" letter-spacing="2.5" fill="#F4F8FF">ABOUT</text><text x="175.4" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">关于</text><line x1="32" y1="76" x2="648" y2="76" stroke="#1E4159"/><rect x="32" y="75" width="72" height="2" fill="url(#bar)"/><text x="32" y="122" font-size="19" fill="#CBD8EA" letter-spacing="0.2">First-year student in Intelligent Science &amp; Technology. I</text><text x="32" y="153" font-size="19" fill="#CBD8EA" letter-spacing="0.2">keep wondering whether a machine can remember a person —</text><text x="32" y="184" font-size="19" fill="#CBD8EA" letter-spacing="0.2">and still recognise that light years later.</text><text x="32" y="229" font-size="19" fill="#CBD8EA" letter-spacing="0.2">So I'm building Shuguang: an AI that remembers, refuses,</text><text x="32" y="260" font-size="19" fill="#CBD8EA" letter-spacing="0.2">and slowly grows a self. Along the way I write small tools</text><text x="32" y="291" font-size="19" fill="#CBD8EA" letter-spacing="0.2">that actually run.</text><line x1="32" y1="328" x2="648" y2="328" stroke="#17324A"/><text x="32" y="370" font-size="14" fill="#8FA3BC" letter-spacing="0.6">2026 级智能科学与技术本科生。想一些更远的事：机器能不能记住一个人，能不能在很久以后还认</text><text x="32" y="395" font-size="14" fill="#8FA3BC" letter-spacing="0.6">得那束光。</text><text x="32" y="428" font-size="14" fill="#8FA3BC" letter-spacing="0.6">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样子的 AI。也写一些真的能跑起来的小</text><text x="32" y="453" font-size="14" fill="#8FA3BC" letter-spacing="0.6">工具。</text></svg>