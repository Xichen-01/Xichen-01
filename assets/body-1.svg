<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 456" width="1200" height="456"><defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.75" stop-color="#38BDF8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B9CF6" stop-opacity="0.30"/><stop offset="1" stop-color="#8B9CF6" stop-opacity="0"/>
  </radialGradient>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Inter", "Noto Sans SC", sans-serif; }
    .mono { font-family: Consolas, "JetBrains Mono", monospace; }
  </style>
</defs><rect x="0" y="0" width="1200" height="456" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="1199" height="455" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><rect x="64" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="79" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">01</text><text x="108" y="52" font-size="22" font-weight="700" letter-spacing="2.5" fill="#F4F8FF">ABOUT</text><text x="207.4" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">关于</text><line x1="64" y1="76" x2="1136" y2="76" stroke="#1E4159"/><rect x="64" y="75" width="72" height="2" fill="url(#bar)"/><text x="64" y="122" class="mono" font-size="10" letter-spacing="3.2" fill="#6B7F9E">PROFILE</text><rect x="64" y="132" width="20" height="1.5" fill="#5EEAD4" opacity="0.5"/><text x="678" y="122" font-size="13" letter-spacing="2.6" fill="#6B7F9E">个人简介</text><rect x="678" y="132" width="20" height="1.5" fill="#38BDF8" opacity="0.4"/><text x="64" y="164" font-size="20" fill="#CBD8EA">First-year student in Intelligent Science &amp;</text><text x="64" y="198" font-size="20" fill="#CBD8EA">Technology. I keep wondering whether a machine can</text><text x="64" y="232" font-size="20" fill="#CBD8EA">remember a person — and still recognise that light</text><text x="64" y="266" font-size="20" fill="#CBD8EA">years later.</text><text x="64" y="314" font-size="20" fill="#CBD8EA">So I'm building Shuguang: an AI that remembers,</text><text x="64" y="348" font-size="20" fill="#CBD8EA">refuses, and slowly grows a self. Along the way I</text><text x="64" y="382" font-size="20" fill="#CBD8EA">write small tools that actually run.</text><text x="678" y="164" font-size="16" fill="#8FA3BC">2026 级智能科学与技术本科生。想一些更远的事：机器能不能</text><text x="678" y="191" font-size="16" fill="#8FA3BC">记住一个人，能不能在很久以后还认得那束光。</text><text x="678" y="228" font-size="16" fill="#8FA3BC">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样子</text><text x="678" y="255" font-size="16" fill="#8FA3BC">的 AI。也写一些真的能跑起来的小工具。</text><line x1="650.0" y1="112" x2="650.0" y2="422" stroke="#1E4159"/></svg>