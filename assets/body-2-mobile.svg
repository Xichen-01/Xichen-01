</defs><rect x="0" y="0" width="680" height="456" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="679" height="455" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><rect x="32" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="47" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">02</text><text x="76" y="52" font-size="24" font-weight="700" letter-spacing="2.2" fill="#F4F8FF">NOW</text><text x="159.28" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">在做</text><line x1="32" y1="76" x2="648" y2="76" stroke="#1E4159"/><rect x="32" y="75" width="72" height="2" fill="url(#bar)"/><text x="32" y="118" class="mono" font-size="10" letter-spacing="3.2" fill="#6B7F9E">PROFILE</text><text x="32" y="148" font-size="20" fill="#D8E4F3">Shuguang — memory and personality: it forgets, recalls,</text><text x="32" y="181" font-size="20" fill="#D8E4F3">and answers you late at night.</text><text x="32" y="226" font-size="20" fill="#D8E4F3">story-forge — branching stories the reader walks</text><text x="32" y="259" font-size="20" fill="#D8E4F3">through by choice.</text><line x1="32" y1="302" x2="648" y2="302" stroke="#17324A"/><text x="32" y="342" font-size="13" letter-spacing="2.4" fill="#6B7F9E">个人简介</text><text x="32" y="370" font-size="15" fill="#9DB0C7">曙光 —— 给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><text x="32" y="405" font-size="15" fill="#9DB0C7">story-forge —— 把故事写成分岔的路，让读的人自己选。</text></svg>