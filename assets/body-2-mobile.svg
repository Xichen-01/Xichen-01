</defs><rect x="0" y="0" width="680" height="475" rx="14" fill="#070C16"/><rect x="0.5" y="0.5" width="679" height="474" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/><text x="32" y="54" class="mono" font-size="10.5" letter-spacing="3.4" fill="#5EEAD4" opacity="0.75">M-02　·　NOW</text><text x="32" y="94" font-size="17" fill="#CBD8EA" letter-spacing="0.2">Shuguang — memory and personality: it forgets, recalls, and</text><text x="32" y="123" font-size="17" fill="#CBD8EA" letter-spacing="0.2">answers you late at night.</text><text x="32" y="168" font-size="17" fill="#CBD8EA" letter-spacing="0.2">YOLO26 — chasing half a point of mAP through one ablation after</text><text x="32" y="197" font-size="17" fill="#CBD8EA" letter-spacing="0.2">another.</text><text x="32" y="242" font-size="17" fill="#CBD8EA" letter-spacing="0.2">story-forge — branching stories the reader walks through by</text><text x="32" y="271" font-size="17" fill="#CBD8EA" letter-spacing="0.2">choice.</text><line x1="32" y1="308" x2="648" y2="308" stroke="#5EEAD4" stroke-opacity="0.12"/><text x="32" y="352" font-size="14" fill="#8FA3BC" letter-spacing="0.4">曙光 —— 给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><text x="32" y="387" font-size="14" fill="#8FA3BC" letter-spacing="0.4">YOLO26 —— 在视觉里找那 0.5 个点的提升，一遍遍跑消融。</text><text x="32" y="422" font-size="14" fill="#8FA3BC" letter-spacing="0.4">story-forge —— 把故事写成分岔的路，让读的人自己选。</text></svg>