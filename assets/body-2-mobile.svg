</defs><rect x="0" y="0" width="680" height="388" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="679" height="387" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><path d="M1 374 V387 H14" fill="none" stroke="#5EEAD4" stroke-opacity="0.5"/><rect x="32" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="47" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">02</text><text x="76" y="52" font-size="22" font-weight="700" letter-spacing="2.5" fill="#F4F8FF">NOW</text><text x="142.84" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">在做</text><line x1="32" y1="76" x2="648" y2="76" stroke="#1E4159"/><rect x="32" y="75" width="72" height="2" fill="url(#bar)"/><text x="32" y="122" font-size="19" fill="#CBD8EA" letter-spacing="0.2">Shuguang — memory and personality: it forgets, recalls, and</text><text x="32" y="153" font-size="19" fill="#CBD8EA" letter-spacing="0.2">answers you late at night.</text><text x="32" y="198" font-size="19" fill="#CBD8EA" letter-spacing="0.2">story-forge — branching stories the reader walks through</text><text x="32" y="229" font-size="19" fill="#CBD8EA" letter-spacing="0.2">by choice.</text><line x1="32" y1="266" x2="648" y2="266" stroke="#17324A"/><text x="32" y="308" font-size="14" fill="#8FA3BC" letter-spacing="0.6">曙光 —— 给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><text x="32" y="341" font-size="14" fill="#8FA3BC" letter-spacing="0.6">story-forge —— 把故事写成分岔的路，让读的人自己选。</text></svg>