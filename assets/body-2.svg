</defs><rect x="0" y="0" width="1200" height="354" rx="12" fill="#070C16"/><rect x="0.5" y="0.5" width="1199" height="353" rx="12" fill="none" stroke="#1E4159" stroke-opacity="0.9"/><rect x="64" y="28" width="30" height="30" fill="none" stroke="#2E5A78"/><text x="79" y="48.5" text-anchor="middle" class="mono" font-size="12" fill="#5EEAD4">02</text><text x="108" y="52" font-size="22" font-weight="700" letter-spacing="2.5" fill="#F4F8FF">NOW</text><text x="174.84" y="50" font-size="12" letter-spacing="2.4" fill="#6B7F9E">在做</text><line x1="64" y1="76" x2="1136" y2="76" stroke="#1E4159"/><rect x="64" y="75" width="72" height="2" fill="url(#bar)"/><text x="64" y="122" class="mono" font-size="10" letter-spacing="3.2" fill="#6B7F9E">PROFILE</text><rect x="64" y="132" width="20" height="1.5" fill="#5EEAD4" opacity="0.5"/><text x="678" y="122" font-size="13" letter-spacing="2.6" fill="#6B7F9E">个人简介</text><rect x="678" y="132" width="20" height="1.5" fill="#38BDF8" opacity="0.4"/><text x="64" y="164" font-size="20" fill="#CBD8EA">Shuguang — memory and personality: it forgets,</text><text x="64" y="198" font-size="20" fill="#CBD8EA">recalls, and answers you late at night.</text><text x="64" y="246" font-size="20" fill="#CBD8EA">story-forge — branching stories the reader walks</text><text x="64" y="280" font-size="20" fill="#CBD8EA">through by choice.</text><text x="678" y="164" font-size="16" fill="#8FA3BC">曙光 —— 给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><text x="678" y="201" font-size="16" fill="#8FA3BC">story-forge —— 把故事写成分岔的路，让读的人自己选。</text><line x1="650.0" y1="112" x2="650.0" y2="320" stroke="#1E4159"/></svg>