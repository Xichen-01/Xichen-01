<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="联系方式：邮箱 your-email@example.com，GitHub @Xichen-01">
  <title>03 — 联系 / CONTACT</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .k     { font-size: 10.5px; font-weight: 600; letter-spacing: 2.6px; fill: #4A6478; }
      .v     { font-family: "JetBrains Mono", Consolas, monospace; font-size: 17px; fill: #D7E4EF; }
      .note  { font-size: 12.5px; fill: #4F6B82; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="359" rx="16" fill="url(#panel)" stroke="#14304A"/>

  <text x="36" y="56" class="label">03 — 联系 / CONTACT</text>
  <rect x="36" y="72" width="32" height="2" fill="url(#accent)"/>

  <text x="36" y="124" class="k">EMAIL</text>
  <text x="36" y="156" class="v">your-email@example.com</text>

  <text x="36" y="212" class="k">GITHUB</text>
  <text x="36" y="244" class="v">@Xichen-01</text>

  <line x1="36" y1="288" x2="644" y2="288" stroke="#123049"/>

  <text x="36" y="318" class="note">Open to collaboration · 欢迎交流</text>
</svg>
