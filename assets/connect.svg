<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="联系方式：邮箱 your-email@example.com，GitHub @Xichen-01">
  <title>03 — 联系 / CONTACT</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .k     { font-size: 10.5px; font-weight: 600; letter-spacing: 2.6px; fill: #4A6478; }
      .v     { font-family: "JetBrains Mono", Consolas, monospace; font-size: 18px; fill: #D7E4EF; }
      .note  { font-size: 12.5px; letter-spacing: 0.6px; fill: #4F6B82; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="239" rx="16" fill="url(#panel)" stroke="#14304A"/>

  <text x="72" y="66" class="label">03 — 联系 / CONTACT</text>
  <rect x="72" y="82" width="36" height="2" fill="url(#accent)"/>

  <text x="72" y="130" class="k">EMAIL</text>
  <text x="72" y="160" class="v">your-email@example.com</text>

  <text x="640" y="130" class="k">GITHUB</text>
  <text x="640" y="160" class="v">@Xichen-01</text>

  <line x1="72" y1="192" x2="1128" y2="192" stroke="#123049"/>

  <text x="72" y="218" class="note">Open to collaboration · 欢迎交流，直接开 issue 找我</text>
</svg>
