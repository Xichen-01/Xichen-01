<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384"><defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pkt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .body  { fill: #DCE7F0; }
      .small { fill: #7E96AA; }
      .k     { font-size: 15px; font-weight: 600; letter-spacing: 2.4px; fill: #4F6B82; }
      .v     { fill: #C7D6E3; }
      .h1    { font-weight: 700; fill: #F1F7FB; }
      .tag   { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #7DD3FC; }
    </style>
  </defs><rect x="0.5" y="0.5" width="1199" height="383" rx="16" fill="url(#panel)" stroke="#14304A"/><text x="72" y="76" class="label">04 — 联系 / CONTACT</text><rect x="72" y="96" width="36" height="2" fill="url(#accent)"/><text x="72" y="158" class="k">邮箱</text><text x="72" y="194" class="v" font-size="24" style="font-family:Consolas,monospace">your-email@example.com</text><line x1="72" y1="228" x2="1128" y2="228" stroke="#14304A"/><text x="72" y="254" class="k">GitHub</text><text x="72" y="290" class="v" font-size="24" style="font-family:Consolas,monospace">@Xichen-01</text>
  <circle cx="1128" cy="70" r="3" fill="#5EEAD4">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1128" cy="70" r="7" fill="#5EEAD4" opacity="0.18">
    <animate attributeName="r" values="7;12;7" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <line x1="0" y1="383" x2="1200" y2="383" stroke="#12283C" stroke-width="1"/>
  <rect x="0" y="382" width="110" height="2" fill="url(#pkt)" opacity="0.55">
    <animate attributeName="x" values="-120;1200" dur="9s" repeatCount="indefinite"/>
  </rect></svg>