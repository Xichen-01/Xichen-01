</defs><rect width="680" height="1226" fill="#080D1A"/><circle cx="68.0" cy="24.52" r="204.0" fill="#5EEAD4" opacity="0.22" filter="url(#orb)"/><circle cx="652.8" cy="220.67999999999998" r="183.60000000000002" fill="#818CF8" opacity="0.24" filter="url(#orb)"/><circle cx="421.6" cy="1275.04" r="217.6" fill="#F472B6" opacity="0.16" filter="url(#orb)"/><rect x="339.0" y="0" width="2" height="1226" fill="none"/><text x="24" y="52" font-size="11.5" letter-spacing="5" fill="#6F82A0">LI TIANCHENG　·　2026</text><text x="21" y="118" font-size="58" font-weight="700" letter-spacing="4" fill="#F2F6FF">李天成</text><text x="24" y="152" font-size="15" fill="#9FB0CC">智能科学与技术 · 2026 级　·　@Xichen-01</text><text x="24" y="190" font-size="15" fill="#6F82A0">在代码与晨光之间，想留下一点会记得的东西。</text><g filter="url(#shadow)"><rect x="24" y="222" width="632" height="250" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.13"/></g><rect x="25" y="223" width="630" height="1.5" rx="1" fill="#ffffff" opacity="0.16"/><circle cx="53.5" cy="254" r="3" fill="#5EEAD4" opacity="0.9"/><text x="66" y="258" font-size="11.5" letter-spacing="3.4" fill="#6F82A0">关于 / ABOUT</text><text x="50" y="292" font-size="21" fill="#F2F6FF" opacity="0.92">大一，学智能科学与技术。白天写代码，晚上想更远的事：机</text><text x="50" y="326" font-size="21" fill="#F2F6FF" opacity="0.92">器能不能记住一个人，能不能在很久以后还认得那束光。</text><text x="50" y="372" font-size="21" fill="#F2F6FF" opacity="0.92">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样</text><text x="50" y="406" font-size="21" fill="#F2F6FF" opacity="0.92">子的 AI。也做视觉，做小工具，把想法一个个跑起来。</text><g filter="url(#shadow)"><rect x="24" y="488" width="632" height="278" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.13"/></g><rect x="25" y="489" width="630" height="1.5" rx="1" fill="#ffffff" opacity="0.16"/><circle cx="53.5" cy="520" r="3" fill="#5EEAD4" opacity="0.9"/><text x="66" y="524" font-size="11.5" letter-spacing="3.4" fill="#6F82A0">在做 / NOW</text><text x="50" y="560" font-size="24" font-weight="600" fill="#F2F6FF">曙光</text><text x="50" y="584" font-size="16" fill="#9FB0CC">给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><text x="50" y="630" font-size="24" font-weight="600" fill="#F2F6FF">YOLO26</text><text x="50" y="654" font-size="16" fill="#9FB0CC">在视觉里找那 0.5 个点的提升，一遍遍跑消融。</text><text x="50" y="700" font-size="24" font-weight="600" fill="#F2F6FF">story-forge</text><text x="50" y="724" font-size="16" fill="#9FB0CC">把故事写成分岔的路，让读的人自己选。</text><g filter="url(#shadow)"><rect x="24" y="782" width="632" height="180" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.13"/></g><rect x="25" y="783" width="630" height="1.5" rx="1" fill="#ffffff" opacity="0.16"/><circle cx="53.5" cy="814" r="3" fill="#5EEAD4" opacity="0.9"/><text x="66" y="818" font-size="11.5" letter-spacing="3.4" fill="#6F82A0">项目 / WORK</text><text x="50" y="856" font-size="30" font-weight="700" fill="#F2F6FF">story-forge</text><text x="50" y="886" font-size="17" fill="#9FB0CC">交互式 AI 小说生成器。阅读过程中可以选分支，剧情走向由你的选择决定。</text><rect x="50" y="916" width="79.46000000000001" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><text x="89.73" y="933" text-anchor="middle" font-size="10.5" letter-spacing="1.4" fill="#5EEAD4">PYTHON</text><rect x="137.46" y="916" width="70.55000000000001" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><text x="172.735" y="933" text-anchor="middle" font-size="10.5" letter-spacing="1.4" fill="#5EEAD4">FLASK</text><rect x="216.01000000000002" y="916" width="97.28000000000002" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><text x="264.65000000000003" y="933" text-anchor="middle" font-size="10.5" letter-spacing="1.4" fill="#5EEAD4">DEEPSEEK</text><g filter="url(#shadow)"><rect x="24" y="978" width="632" height="176" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.13"/></g><rect x="25" y="979" width="630" height="1.5" rx="1" fill="#ffffff" opacity="0.16"/><circ