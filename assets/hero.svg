  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)" opacity="0.45"/>
  <rect width="1200" height="380" fill="url(#ga)"/>
  <rect width="1200" height="380" fill="url(#gb)"/>
  <rect x="0" width="1200" height="2" fill="url(#pkt)" opacity="0.35">
