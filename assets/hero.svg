    <linearGradient id="pkt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset="1" stop-color="#A5F3FC" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
