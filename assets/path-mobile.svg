ont-weight="700" fill="#DCE7F0">YOLO26 改进实验</text><text x="114" y="384" font-size="18" fill="#93A9BB">在 YOLO26n 上试 2026 顶会里的模块，跑 3–4 组候选，用单</text><text x="114" y="412" font-size="18" fill="#93A9BB">模块消融看能不能撑住 +0.5 mAP。</text><text x="114" y="486" class="mono">现在 · 支线</text><text x="114" y="528" font-size="26" font-weight="700" fill="#DCE7F0">曙光 · AI 人格与记忆</text><text x="114" y="560" font-size="18" fill="#93A9BB">给一个 AI 做长期记忆和人格演化：记忆衰减、日记、内省、关系</text><text x="114" y="588" font-size="18" fill="#93A9BB">模型，跑在自己的服务器上，接 QQ 对话。</text><text x="114" y="662" class="mono">现在 · 小工具</text><text x="114" y="704" font-size="26" font-weight="700" fill="#DCE7F0">story-forge</text><text x="114" y="736" font-size="18" fill="#93A9BB">把大模型接进真实项目：Flask 做服务，DeepSeek 负责生成，做</text><text x="114" y="764" font-size="18" fill="#93A9BB">了分支剧情的交互。</text><text x="114" y="838" class="mono">下一步</text><text x="114" y="880" font-size="26" font-weight="700" fill="#DCE7F0">第一个开源 PR</text><text x="114" y="912" font-size="18" fill="#93A9BB">把手上的东西收拾干净，开始给别人的项目提 PR。</text><line x1="53" y1="118" x2="67" y2="118" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="154" x2="67" y2="154" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="190" x2="67" y2="190" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="226" x2="67" y2="226" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="262" x2="67" y2="262" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="298" x2="67" y2="298" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="334" x2="67" y2="334" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="370" x2="67" y2="370" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="406" x2="67" y2="406" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="442" x2="67" y2="442" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="478" x2="67" y2="478" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="514" x2="67" y2="514" stroke="#3A6A88" opacity="0.45"/><line x1="53" y1="550" x2="67" y2="550" stroke="#3A6A88" opacity="0.45"/><li