<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="story-forge — 交互式 AI 小说生成器，Python、Flask、DeepSeek">
  <title>story-forge — Interactive AI novel generator with branching choices</title>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131F"/>
      <stop offset="1" stop-color="#0B2033"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .repo { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; fill: #F1F5F9; }
      .desc { font-size: 14px; fill: #8AA2B6; }
      .pill { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; fill: #7DD3FC; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="158" rx="16" fill="url(#cardBg)" stroke="#1E3A5F" stroke-width="1"/>
  <rect x="1" y="26" width="3" height="108" rx="1.5" fill="url(#edge)"/>

  <text x="40" y="62" class="repo">story-forge</text>
  <text x="40" y="92" class="desc">交互式 AI 小说生成器 · 阅读中可选分支，剧情由选择决定</text>

  <g>
    <rect x="40" y="108" width="72" height="22" rx="11" fill="#0F2A44" stroke="#1E4B73" stroke-width="1"/>
    <text x="76" y="123" class="pill" text-anchor="middle">PYTHON</text>

    <rect x="120" y="108" width="62" height="22" rx="11" fill="#0F2A44" stroke="#1E4B73" stroke-width="1"/>
    <text x="151" y="123" class="pill" text-anchor="middle">FLASK</text>

    <rect x="190" y="108" width="96" height="22" rx="11" fill="#0F2A44" stroke="#1E4B73" stroke-width="1"/>
    <text x="238" y="123" class="pill" text-anchor="middle">DEEPSEEK</text>
  </g>

  <g transform="translate(928,63)">
    <circle cx="16" cy="16" r="17" fill="#0A1E31" stroke="#1E4B73" stroke-width="1.2"/>
    <path d="M9 23 L22 10 M13 10 H22 V19" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
