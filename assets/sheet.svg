size="13" fill="#5EEAD4">@Xichen-01</text><text x="72" y="316" font-size="17" fill="#93A9BB">智能科学与技术 · 2026 级</text><text x="798" y="288" class="mono" font-size="11.5">PART NO</text><text x="918" y="288" font-size="13" fill="#E4EDF5">LT-2026</text><line x1="798" y1="298" x2="1128" y2="298" stroke="#254A62" opacity="0.6"/><text x="798" y="318" class="mono" font-size="11.5">REV</text><text x="918" y="318" font-size="13" fill="#E4EDF5">D</text><line x1="798" y1="328" x2="1128" y2="328" stroke="#254A62" opacity="0.6"/><text x="798" y="348" class="mono" font-size="11.5">STATUS</text><text x="918" y="348" font-size="13" fill="#E4EDF5">ACTIVE</text><line x1="798" y1="358" x2="1128" y2="358" stroke="#254A62" opacity="0.6"/><text x="72" y="360" font-size="16" font-weight="700" letter-spacing="3" fill="#E4EDF5">特性</text><text x="120.0" y="359" class="mono" font-size="12">FEATURES</text><line x1="72" y1="374" x2="1128" y2="374" stroke="#254A62"/><rect x="72" y="373" width="64" height="2" fill="url(#accent)"/><path d="M78 399 l5 5 l-5 5 l-5 -5 Z" fill="#5EEAD4" opacity="0.85"/><text x="102" y="406" font-size="28" fill="#E4EDF5">2026 级智能科学与技术本科生，目前压在视觉和智能体两条线上。</text><path d="M78 453 l5 5 l-5 5 l-5 -5 Z" fill="#5EEAD4" opacity="0.85"/><text x="102" y="460" font-size="28" fill="#E4EDF5">在 YOLO26n 上试 2026 顶会里的模块，跑 3–4 组候选，只看单模块消融能不</text><text x="102" y="502" font-size="28" fill="#E4EDF5">能撑住 +0.5 mAP。</text><path d="M78 549 l5 5 l-5 5 l-5 -5 Z" fill="#5EEAD4" opacity="0.85"/><text x="102" y="556" font-size="28" fill="#E4EDF5">在做一个会记事、有人格的 AI：记忆衰减、日记、内省、关系模型，接 QQ 长期</text><text x="102" y="598" font-size="28" fill="#E4EDF5">跑。</text><path d="M78 645 l5 5 l-5 5 l-5 -5 Z" fill="#5EEAD4" opacity="0.85"/><text x="102" y="652" font-size="28" fill="#E4EDF5">顺手写工具，story-forge 用 Flask + DeepSeek 做分支剧情生成。</text><text x="72" y="724" font-size="16" font-weight="700" letter-spacing="3" fill="#E4EDF5">修订记录</text><text x="152.0" y="723" class="mono" font-size="12">REVISION HISTORY</text><line x1