<line x1="0" y1="1384" x2="680" y2="1384" stroke="url(#hline)"/><text x="44" y="74" class="sans" font-size="11.5" letter-spacing="6" fill="#6E5C74">LI TIANCHENG　·　2026</text><text x="38" y="180" class="serif" font-size="62" font-weight="600" letter-spacing="8" fill="#F5EBDF">李天成</text><text x="44" y="220" class="sans" font-size="12" letter-spacing="8" fill="#B8A4AE">LI TIANCHENG</text><line x1="44" y1="256" x2="284" y2="256" stroke="#D98876" stroke-opacity="0.45"/><rect x="290" y="253" width="6" height="6" transform="rotate(45 293 256)" fill="#D98876" opacity="0.8"/><text x="44" y="318" class="serif" font-size="20" fill="#F5EBDF" opacity="0.95">在代码与晨光之间，我想留下一点会记得的东西。</text><text x="44" y="362" class="sans" font-size="15" fill="#B8A4AE" opacity="0.75">Something that remembers, between the code and the dawn.</text><text x="44" y="408" class="mono" font-size="15" letter-spacing="1" fill="#F0A868">@Xichen-01</text><text x="44" y="504" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">关于　ABOUT</text><line x1="44" y1="520" x2="88" y2="520" stroke="#F0A868" stroke-opacity="0.55"/><text x="44" y="556" class="serif" font-size="21" fill="#F5EBDF" opacity="0.9">大一，学智能科学与技术。白天写代码，晚上想一些更远的事：</text><text x="44" y="592" class="serif" font-size="21" fill="#F5EBDF" opacity="0.9">机器能不能记住一个人，能不能在很久以后，还认得那束光。</text><text x="44" y="648" class="serif" font-size="21" fill="#F5EBDF" opacity="0.9">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样子</text><text x="44" y="684" class="serif" font-size="21" fill="#F5EBDF" opacity="0.9">的 AI。也做视觉，做小工具，把想法一个个跑起来。</text><text x="44" y="774" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">在做　NOW</text><line x1="44" y1="790" x2="88" y2="790" stroke="#F0A868" stroke-opacity="0.55"/><circle cx="49" cy="820" r="3" fill="#F0A868" opacity="0.9"/><text x="70" y="826" class="serif" font-size="22" fill="#F5EBDF">曙光</text><text x="70" y="860" class="serif" font-size="17" fill="#B8A4AE">给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><circle cx="49" cy="916" r="3" fill="#F0A868" opacity="0.9"/><text x="70" y="922" class="serif" font-size="22" fill="#F5EBDF">YOLO26</text><text x="70" y="956" class="serif" font-size="17" fill="#B8A4AE">在视觉里找那 0.5 个点的提升，一遍遍跑消融。</text><circle cx="49" cy="1012" r="3" fill="#F0A868" opacity="0.9"/><text x="70" y="1018" class="serif" font-size="22" fill="#F5EBDF">story-forge</text><text x="70" y="1052" class="serif" font-size="17" fill="#B8A4AE">把故事写成分岔的路，让读的人自己选。</text><text x="44" y="1134" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">找到我　CONTACT</text><line x1="44" y1="1150" x2="88" y2="1150" stroke="#F0A868" stroke-opacity="0.55"/><text x="44" y="1186" class="sans" font-size="10.5" letter-spacing="4" fill="#6E5C74">GITHUB</text><text x="44" y="1214" class="mono" font-size="16" fill="#F5EBDF">@Xichen-01</text><text x="44" y="1260" class="sans" font-size="10.5" letter-spacing="4" fill="#6E5C74">EMAIL</text><text x="44" y="1288" class="mono" font-size="16" fill="#F5EBDF">your-email@example.com</text><text x="340.0" y="1448" text-anchor="middle" class="sans" font-size="11" letter-spacing="5" fill="#B8A4AE" opacity="0.85">李天成　·　@Xichen-01　·　2026</text></svg>