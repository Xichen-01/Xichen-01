<line x1="0" y1="1535" x2="1200" y2="1535" stroke="url(#hline)"/><text x="120" y="96" class="sans" font-size="11.5" letter-spacing="6" fill="#6E5C74">LI TIANCHENG　·　2026</text><text x="114" y="246" class="serif" font-size="96" font-weight="600" letter-spacing="8" fill="#F5EBDF">李天成</text><text x="120" y="286" class="sans" font-size="16" letter-spacing="8" fill="#B8A4AE">LI TIANCHENG</text><line x1="120" y1="322" x2="360" y2="322" stroke="#D98876" stroke-opacity="0.45"/><rect x="366" y="319" width="6" height="6" transform="rotate(45 369 322)" fill="#D98876" opacity="0.8"/><text x="120" y="384" class="serif" font-size="27" fill="#F5EBDF" opacity="0.95">在代码与晨光之间，我想留下一点会记得的东西。</text><text x="120" y="439" class="sans" font-size="18" fill="#B8A4AE" opacity="0.75">Something that remembers, between the code and the dawn.</text><text x="120" y="485" class="mono" font-size="15" letter-spacing="1" fill="#F0A868">@Xichen-01</text><text x="120" y="581" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">关于　ABOUT</text><line x1="120" y1="597" x2="164" y2="597" stroke="#F0A868" stroke-opacity="0.55"/><text x="120" y="633" class="serif" font-size="28" fill="#F5EBDF" opacity="0.9">大一，学智能科学与技术。白天写代码，晚上想一些更远的事：机器能</text><text x="120" y="680" class="serif" font-size="28" fill="#F5EBDF" opacity="0.9">不能记住一个人，能不能在很久以后，还认得那束光。</text><text x="120" y="747" class="serif" font-size="28" fill="#F5EBDF" opacity="0.9">所以我在做曙光——一个会记事、会拒绝、会慢慢长出自己样子的 AI。</text><text x="120" y="794" class="serif" font-size="28" fill="#F5EBDF" opacity="0.9">也做视觉，做小工具，把想法一个个跑起来。</text><text x="120" y="895" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">在做　NOW</text><line x1="120" y1="911" x2="164" y2="911" stroke="#F0A868" stroke-opacity="0.55"/><circle cx="125" cy="941" r="3" fill="#F0A868" opacity="0.9"/><text x="146" y="947" class="serif" font-size="28" fill="#F5EBDF">曙光</text><text x="146" y="987" class="serif" font-size="20" fill="#B8A4AE">给它记忆和人格：会忘，会想起，会在深夜回你一句。</text><circle cx="125" cy="1047" r="3" fill="#F0A868" opacity="0.9"/><text x="146" y="1053" class="serif" font-size="28" fill="#F5EBDF">YOLO26</text><text x="146" y="1093" class="serif" font-size="20" fill="#B8A4AE">在视觉里找那 0.5 个点的提升，一遍遍跑消融。</text><circle cx="125" cy="1153" r="3" fill="#F0A868" opacity="0.9"/><text x="146" y="1159" class="serif" font-size="28" fill="#F5EBDF">story-forge</text><text x="146" y="1199" class="serif" font-size="20" fill="#B8A4AE">把故事写成分岔的路，让读的人自己选。</text><text x="120" y="1285" class="sans" font-size="12" letter-spacing="5" fill="#6E5C74">找到我　CONTACT</text><line x1="120" y1="1301" x2="164" y2="1301" stroke="#F0A868" stroke-opacity="0.55"/><text x="120" y="1337" class="sans" font-size="10.5" letter-spacing="4" fill="#6E5C74">GITHUB</text><text x="120" y="1365" class="mono" font-size="16" fill="#F5EBDF">@Xichen-01</text><text x="120" y="1411" class="sans" font-size="10.5" letter-spacing="4" fill="#6E5C74">EMAIL</text><text x="120" y="1439" class="mono" font-size="16" fill="#F5EBDF">your-email@example.com</text><text x="600.0" y="1629" text-anchor="middle" class="sans" font-size="11" letter-spacing="5" fill="#B8A4AE" opacity="0.85">李天成　·　@Xichen-01　·　2026</text></svg>