<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="项目：story-forge，交互式 AI 小说生成器，Python、Flask、DeepSeek">
  <title>02 — 项目 / WORK</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#08121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #4F6B82; }
      .repo  { font-size: 30px; font-weight: 700; letter-spacing: 0.4px; fill: #F1F6FA; }
      .desc  { font-size: 14.5px; fill: #7E96AA; }
      .pill  { font-size: 10.5px; font-weight: 600; letter-spacing: 1.6px; fill: #7DD3FC; }
      .meta  { font-size: 11.5px; letter-spacing: 1.4px; fill: #4A6478; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="url(#panel)" stroke="#14304A"/>

  <text x="72" y="72" class="label">02 — 项目 / WORK</text>
  <rect x="72" y="88" width="36" height="2" fill="url(#accent)"/>

  <rect x="72" y="106" width="1056" height="148" rx="12" fill="#0B1926" stroke="#16324B"/>
  <rect x="72" y="106" width="3.5" height="148" rx="1.75" fill="url(#edge)"/>

  <text x="112" y="152" class="repo">story-forge</text>
  <text x="112" y="180" class="desc">交互式 AI 小说生成器 · 阅读中选择分支，剧情由你的选择决定</text>

  <g>
    <rect x="112" y="200" width="78" height="24" rx="12" fill="#0C2436" stroke="#1B4B6B"/>
    <text x="151" y="216" class="pill" text-anchor="middle">PYTHON</text>

    <rect x="198" y="200" width="66" height="24" rx="12" fill="#0C2436" stroke="#1B4B6B"/>
    <text x="231" y="216" class="pill" text-anchor="middle">FLASK</text>

    <rect x="272" y="200" width="100" height="24" rx="12" fill="#0C2436" stroke="#1B4B6B"/>
    <text x="322" y="216" class="pill" text-anchor="middle">DEEPSEEK</text>
  </g>

  <line x1="996" y1="132" x2="996" y2="228" stroke="#14304A"/>

  <g transform="translate(1046,162)">
    <circle cx="18" cy="18" r="18" fill="none" stroke="#1E4B73"/>
    <path d="M11 25 L25 11 M15 11 H25 V21" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
